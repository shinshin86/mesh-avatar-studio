language = "C"
include_guard = "MESH_AVATAR_H"
autogen_warning = "/* Generated by cbindgen 0.29.4. Do not edit; run conformance/ffi-header.sh. */"
usize_is_size_t = true
documentation = true
style = "type"
cpp_compat = true
header = """
/* Experimental CPU-only Mesh Avatar C ABI.
 *
 * Handles are opaque uint64 tokens, not pointers. Zero/unknown/destroyed tokens
 * are rejected, and IDs are never reused. Handles may be used from any thread;
 * API calls on the same handle are serialized internally.
 *
 * All returned pointers are borrowed, read-only library storage: NEVER free or
 * modify them. Frame/layer pointers (including names, arrays and descriptors)
 * expire on the next tick or destroy of that handle. Texture name/RGBA pointers
 * expire only at destroy. Copying a descriptor does not copy the pointed-to data.
 * Callers MUST synchronize borrowed reads against tick/destroy on other threads.
 *
 * Input strings are readable UTF-8 NUL-terminated C strings. Nonempty input
 * buffers must be readable/aligned for their specified lengths. Output pointers
 * must be writable/aligned and must not alias inputs or borrowed library data.
 * NULL pointers, invalid handle tokens and indices are checked; the caller is
 * still responsible for non-NULL memory validity. Inputs are consumed/copied
 * during the call and are never retained.
 *
 * Return values are MA_* status codes. A failed call sets a thread-local error;
 * mesh_avatar_last_error returns it until the next API call on that thread.
 * Default Cargo profiles use unwinding: Rust panics become MA_PANIC. A handle
 * whose state panicked must be destroyed and reopened; other handles remain usable.
 * No caller-visible allocation needs a separate free function.
 * Destroy every handle before unloading the library. All borrowed pointers,
 * including version/error strings, become invalid when the library is unloaded.
 */
"""

[parse]
parse_deps = false

[export]
item_types = ["constants", "enums", "structs", "typedefs", "functions"]
exclude = ["Entries", "Entry", "CachedFrame", "Error", "Result", "RenderEntry", "RenderEntries", "MaRenderer", "MaRenderOptions", "MA_GPU_UNAVAILABLE", "MA_RENDER_ERROR", "MA_FIT_CONTAIN", "MA_FIT_COVER", "MA_RGBA_STRAIGHT", "MA_RGBA_PREMULTIPLIED", "mesh_avatar_renderer_create", "mesh_avatar_renderer_render", "mesh_avatar_renderer_resize", "mesh_avatar_renderer_destroy"]
