[package]
name = "mesh-avatar-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
render = ["dep:mesh-avatar-wgpu", "dep:pollster"]

[dependencies]
mesh-avatar-core.workspace = true
mesh-avatar-wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[dev-dependencies]
zip.workspace = true
serde_json.workspace = true
