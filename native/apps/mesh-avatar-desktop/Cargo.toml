[package]
name = "mesh-avatar-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mesh-avatar-core.workspace = true
mesh-avatar-wgpu.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "0.18.2", default-features = false }
muda = { version = "0.19.3", default-features = false }
tray-icon = { version = "0.24.2", default-features = false }
rfd = { version = "0.17", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry"] }
